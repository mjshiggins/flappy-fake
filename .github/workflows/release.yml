name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version=$v' manifest.json > manifest.tmp && mv manifest.tmp manifest.json
          mkdir -p package/dist package/icons
          cp manifest.json package/
          cp dist/main.js package/dist/
          cp icons/*.png package/icons/
          cd package && zip -r "../flappy-fake-$VERSION.zip" . && cd ..
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" flappy-fake-*.zip --generate-notes --title "$GITHUB_REF_NAME"
